name: grupo13-hito9

services:
  iris:
    image: intersystems/iris-community:latest-cd
    restart: unless-stopped
    ports:
      - "127.0.0.1:1972:1972"
      - "127.0.0.1:52773:52773"
    environment:
      ISC_DATA_DIRECTORY: /durable
    volumes:
      - type: bind
        source: ${USERPROFILE:?Definir USERPROFILE}/docker/data/iris
        target: /durable
      - type: bind
        source: ./scripts
        target: /scripts
        read_only: true
