  /api/v1/partidos/{partidoId}/estadisticas/comparacion:
    get:
      tags:
      - estadisticas
      summary: CU-16 · Comparar los equipos de un partido
      description: 'Una fila por equipo con medidas agregadas sobre [desde, hasta), ventana de como máximo
        5 min. `muestras` = COUNT(*) en [desde, hasta); `muestrasEsperadas` = timestamps múltiplos del
        paso de la serie (1 s) en la ventana; `posesionMedia` = ROUND(AVG(posesion_pct), 3); `pasesNuevos`
        = SUM de pases_acumulados − LAG(pases_acumulados) por serie, incluyendo la muestra anterior a
        desde; `tiros` = SUM(tiros_intervalo); `intervalosInvalidos` = muestras sin muestra anterior,
        con separación distinta del paso o con contador que retrocede; `completo` = muestras == muestrasEsperadas
        y intervalosInvalidos == 0. No se rellenan huecos con ceros. Partido sin puntos → 200 con `equipos:
        []`.'
