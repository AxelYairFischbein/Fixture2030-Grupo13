tags:
- name: salud
  description: Estado de las dependencias y del catálogo de partidos.
- name: equipos
  description: Fichas, listados y planteles (MongoDB, Hito 4; caché Redis, Hito 7) y agenda de un equipo
    (Neo4j, Hito 5).
- name: jugadores
  description: Ficha de un jugador (MongoDB, Hito 4).
- name: partidos
  description: 'Calendario y eventos de un partido (Neo4j, Hito 5). No informan el estado del partido
    (fuente: IRIS).'
- name: comentarios
  description: Lectura, publicación idempotente y moderación de comentarios (Cassandra, Hito 6; sesión
    Redis).
- name: sesiones
  description: Consulta, renovación y cierre de la sesión vigente (Redis, Hito 7). La sesión viaja en
    X-Session-Id.
- name: cache
  description: Invalidación de la ficha cacheada de un equipo (Redis, Hito 7; rol operador).
- name: estadisticas
  description: Estadísticas temporales por partido y equipo (InfluxDB 3, Hito 8).
- name: actas
  description: Acta y transiciones de estado del partido (InterSystems IRIS, Hito 9; fuente autoritativa
    del estado).
