      operationId: plantel_api_v1_equipos__equipoId__jugadores_get
      parameters:
      - name: equipoId
        in: path
        required: true
        schema:
          type: string
          pattern: ^EQ-\d{3}$
          examples:
          - EQ-001
          title: Equipoid
      - name: posicion
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/Posicion'
          - type: 'null'
          title: Posicion
      - name: pagina
        in: query
        required: false
        schema:
          type: integer
          maximum: 1000
          minimum: 1
          default: 1
          title: Pagina
      - name: tamanio
        in: query
        required: false
        schema:
          type: integer
          maximum: 50
          minimum: 1
          default: 24
          title: Tamanio
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Respuesta_list_Jugador__'
        '404':
          description: Recurso inexistente (o sesión no vigente).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '503':
          description: Dependencia no disponible o acceso rechazado. No equivale a
            un resultado vacío.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '504':
          description: La dependencia excedió el tiempo de espera identificado por
            el driver.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '400':
          description: Validación fallida. No se consulta ninguna fuente.
          content: *id001
        '500':
          description: Error interno seguro; detalle solo en logs.
          content: *id001
  /api/v1/equipos/{equipoId}/partidos:
    get:
      tags:
      - Partidos · Neo4j
      summary: Agenda del equipo con rival y estadio
      operationId: agenda_api_v1_equipos__equipoId__partidos_get
      parameters:
      - name: equipoId
        in: path
        required: true
        schema:
          type: string
          pattern: ^EQ-\d{3}$
          examples:
          - EQ-001
          title: Equipoid
      - name: limite
        in: query
        required: false
        schema:
          type: integer
          maximum: 20
          minimum: 1
          default: 10
          title: Limite
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Respuesta_list_PartidoAgenda__'
        '404':
          description: Recurso inexistente (o sesión no vigente).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '503':
          description: Dependencia no disponible o acceso rechazado. No equivale a
            un resultado vacío.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '504':
          description: La dependencia excedió el tiempo de espera identificado por
            el driver.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '400':
          description: Validación fallida. No se consulta ninguna fuente.
          content: *id001
        '500':
          description: Error interno seguro; detalle solo en logs.
          content: *id001
  /api/v1/partidos/{partidoId}:
    get:
      tags:
      - Partidos · Neo4j
      summary: Partido con equipos, estadio y eventos
      operationId: partido_api_v1_partidos__partidoId__get
      parameters:
      - name: partidoId
        in: path
        required: true
        schema:
          type: string
          pattern: ^PAR-\d{3}$
          examples:
          - PAR-001
          title: Partidoid
      - name: limiteEventos
        in: query
        required: false
        schema:
          type: integer
          maximum: 50
          minimum: 1
          default: 20
          title: Limiteeventos
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Respuesta_Partido_'
        '404':
          description: Recurso inexistente (o sesión no vigente).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '503':
          description: Dependencia no disponible o acceso rechazado. No equivale a
            un resultado vacío.
          content:
            application/json:
