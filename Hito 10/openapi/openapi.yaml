  /api/v1/partidos:
    get:
      tags:
      - partidos
      summary: CU-07 · Ver partidos de un rango de fechas
      description: 'Rango semiabierto [desde, hasta) en UTC, de hasta 7 días. Orden inicio, partidoId.
        Intervalo o estadio sin partidos → items vacío. No incluye el estado del partido (fuente: IRIS,
        CU-18).'
      operationId: listar_partidos_api_v1_partidos_get
      parameters:
      - name: desde
        in: query
        required: true
        schema:
          type: string
          format: date-time
          examples:
          - '2030-06-10T00:00:00Z'
          title: Desde
      - name: hasta
        in: query
        required: true
        schema:
          type: string
          format: date-time
          examples:
          - '2030-06-11T00:00:00Z'
          title: Hasta
      - name: estadioId
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            pattern: ^EST-\d{2}$
          - type: 'null'
          examples:
          - EST-01
          title: Estadioid
      - name: limite
        in: query
        required: false
        schema:
          type: integer
          maximum: 64
          minimum: 1
          default: 64
          title: Limite
      responses:
        '200':
          description: Respuesta exitosa.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalendarioPartidos'
        '400':
          description: VALIDACION. Parámetro ausente, con formato inválido o fuera de rango; intervalo
            invertido o excedido; body con campos extra. Se responde antes de consultar.
          content:
            application/json:
              examples:
                VALIDACION:
                  summary: VALIDACION
                  value:
                    error:
                      codigo: VALIDACION
                      mensaje: La solicitud tiene datos inválidos.
                      requestId: 8f0c2a1e-6b3d-4f7a-9d55-2a1b7c9e4d10
                      detalles:
                      - campo: partidoId
                        problema: no cumple el formato ^PAR-\d{3}$
              schema:
                $ref: '#/components/schemas/RespuestaError'
        '500':
          description: ERROR_INTERNO. Error inesperado o de configuración; el detalle queda solo en logs.
          content:
            application/json:
