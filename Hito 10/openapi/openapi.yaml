openapi: 3.1.0
info:
  title: Fixture 2030 - API integrada (Grupo 13, Hito 10)
  description: Acceso controlado a los módulos NoSQL del Fixture Mundial 2030. Datos
    sintéticos.
  version: 1.0.0
servers:
- url: http://127.0.0.1:8000
  description: API local en la notebook
paths:
  /api/v1/salud:
    get:
      tags:
      - Salud
      summary: Conectividad de las seis fuentes
      operationId: salud_api_v1_salud_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Respuesta_list_EstadoFuente__'
        '503':
          description: Al menos una fuente no responde; `detalles` informa el estado
            de cada una.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '500':
          description: Error interno seguro; detalle solo en logs.
          content: &id001
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
  /api/v1/equipos:
    get:
      tags:
      - Equipos · MongoDB
      summary: Listado paginado de equipos
      operationId: listar_equipos_api_v1_equipos_get
      parameters:
      - name: confederacion
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/Confederacion'
          - type: 'null'
          title: Confederacion
      - name: pagina
        in: query
        required: false
        schema:
          type: integer
          maximum: 1000
          minimum: 1
          default: 1
          title: Pagina
      - name: tamanio
        in: query
        required: false
        schema:
          type: integer
          maximum: 50
          minimum: 1
          default: 16
          title: Tamanio
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Respuesta_list_EquipoResumen__'
        '503':
          description: Dependencia no disponible o acceso rechazado. No equivale a
            un resultado vacío.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '504':
          description: La dependencia excedió el tiempo de espera identificado por
            el driver.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '400':
          description: Validación fallida. No se consulta ninguna fuente.
          content: *id001
        '500':
          description: Error interno seguro; detalle solo en logs.
          content: *id001
  /api/v1/equipos/{equipoId}:
    get:
      tags:
      - Equipos · MongoDB
      summary: Ficha de un equipo (cache-aside en Redis)
      operationId: obtener_equipo_api_v1_equipos__equipoId__get
      parameters:
      - name: equipoId
        in: path
        required: true
        schema:
          type: string
          pattern: ^EQ-\d{3}$
          examples:
          - EQ-001
          title: Equipoid
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Respuesta_Equipo_'
        '404':
          description: Recurso inexistente (o sesión no vigente).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '503':
          description: Dependencia no disponible o acceso rechazado. No equivale a
            un resultado vacío.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '504':
          description: La dependencia excedió el tiempo de espera identificado por
            el driver.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '400':
          description: Validación fallida. No se consulta ninguna fuente.
          content: *id001
        '500':
          description: Error interno seguro; detalle solo en logs.
          content: *id001
  /api/v1/equipos/{equipoId}/cache:
    delete:
      tags:
      - Equipos · MongoDB
      summary: Invalidar la ficha en caché (idempotente)
      operationId: invalidar_equipo_api_v1_equipos__equipoId__cache_delete
      parameters:
      - name: equipoId
        in: path
        required: true
        schema:
          type: string
          pattern: ^EQ-\d{3}$
          examples:
          - EQ-001
          title: Equipoid
      responses:
        '204':
          description: Successful Response
        '503':
          description: Dependencia no disponible o acceso rechazado. No equivale a
            un resultado vacío.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '504':
          description: La dependencia excedió el tiempo de espera identificado por
            el driver.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '400':
          description: Validación fallida. No se consulta ninguna fuente.
          content: *id001
        '500':
          description: Error interno seguro; detalle solo en logs.
          content: *id001
  /api/v1/equipos/{equipoId}/jugadores:
    get:
      tags:
