          description: DEPENDENCIA_TIMEOUT. Una fuente de datos no respondió a tiempo; en escrituras,
            el resultado es incierto.
          content:
            application/json:
              examples:
                DEPENDENCIA_TIMEOUT:
                  summary: DEPENDENCIA_TIMEOUT
                  value:
                    error:
                      codigo: DEPENDENCIA_TIMEOUT
                      mensaje: Una fuente de datos no respondió a tiempo.
                      requestId: 8f0c2a1e-6b3d-4f7a-9d55-2a1b7c9e4d10
                      detalles: []
              schema:
                $ref: '#/components/schemas/RespuestaError'
  /api/v1/partidos/{partidoId}/acta/transiciones:
    post:
      tags:
      - actas
      summary: CU-19 · Cambiar el estado de un partido
      description: Requiere una sesión con rol operador. Solo PENDIENTE → EN_JUEGO → FINALIZADO, aplicado
        con CambiarEstado() en IRIS. Si el estado ya es el pedido → 200 con cambio=false (reintento seguro
        tras un 504). Transición no permitida → 409 TRANSICION_NO_PERMITIDA con el estado actual en detalles.
      operationId: transicionar_api_v1_partidos__partidoId__acta_transiciones_post
      parameters:
      - name: partidoId
        in: path
        required: true
        schema:
          type: string
          pattern: ^PAR-\d{3}$
          examples:
          - PAR-001
          title: Partidoid
      - name: X-Session-Id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
            pattern: ^[A-Za-z0-9-]{8,64}$
          - type: 'null'
          description: 'Identificador de sesión (Hito 7). Es una credencial: no se registra en logs.'
          title: X-Session-Id
        description: 'Identificador de sesión (Hito 7). Es una credencial: no se registra en logs.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SolicitudTransicion'
      responses:
        '200':
          description: Respuesta exitosa.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultadoTransicion'
        '400':
          description: VALIDACION. Parámetro ausente, con formato inválido o fuera de rango; intervalo
            invertido o excedido; body con campos extra. Se responde antes de consultar.
          content:
            application/json:
              examples:
                VALIDACION:
                  summary: VALIDACION
                  value:
                    error:
                      codigo: VALIDACION
                      mensaje: La solicitud tiene datos inválidos.
                      requestId: 8f0c2a1e-6b3d-4f7a-9d55-2a1b7c9e4d10
                      detalles:
                      - campo: partidoId
                        problema: no cumple el formato ^PAR-\d{3}$
              schema:
                $ref: '#/components/schemas/RespuestaError'
        '401':
          description: SESION_REQUERIDA, SESION_NO_VIGENTE. Falta X-Session-Id o la sesión no es vigente
            (ausente, vencida, sin TTL o inactiva).
          content:
            application/json:
              examples:
                SESION_REQUERIDA:
                  summary: SESION_REQUERIDA
                  value:
                    error:
                      codigo: SESION_REQUERIDA
                      mensaje: La operación requiere el encabezado X-Session-Id.
                      requestId: 8f0c2a1e-6b3d-4f7a-9d55-2a1b7c9e4d10
                      detalles: []
                SESION_NO_VIGENTE:
                  summary: SESION_NO_VIGENTE
                  value:
                    error:
                      codigo: SESION_NO_VIGENTE
                      mensaje: La sesión no existe, venció o no está activa.
                      requestId: 8f0c2a1e-6b3d-4f7a-9d55-2a1b7c9e4d10
                      detalles: []
              schema:
                $ref: '#/components/schemas/RespuestaError'
        '403':
          description: ROL_NO_AUTORIZADO. La sesión vigente no tiene el rol necesario.
          content:
            application/json:
              examples:
                ROL_NO_AUTORIZADO:
                  summary: ROL_NO_AUTORIZADO
                  value:
                    error:
                      codigo: ROL_NO_AUTORIZADO
                      mensaje: La sesión no tiene el rol necesario para esta operación.
                      requestId: 8f0c2a1e-6b3d-4f7a-9d55-2a1b7c9e4d10
                      detalles: []
              schema:
                $ref: '#/components/schemas/RespuestaError'
        '404':
          description: ACTA_NO_ENCONTRADA. El recurso principal de la ruta no existe.
          content:
            application/json:
              examples:
                ACTA_NO_ENCONTRADA:
                  summary: ACTA_NO_ENCONTRADA
                  value:
                    error:
                      codigo: ACTA_NO_ENCONTRADA
                      mensaje: No existe un acta para el partido indicado.
                      requestId: 8f0c2a1e-6b3d-4f7a-9d55-2a1b7c9e4d10
                      detalles:
                      - campo: partidoId
                        problema: PAR-002 no tiene acta
              schema:
                $ref: '#/components/schemas/RespuestaError'
        '409':
          description: TRANSICION_NO_PERMITIDA. Regla de negocio violada por el estado actual o por una
            clave ya usada.
          content:
            application/json:
              examples:
                TRANSICION_NO_PERMITIDA:
                  summary: TRANSICION_NO_PERMITIDA
                  value:
                    error:
                      codigo: TRANSICION_NO_PERMITIDA
                      mensaje: El estado actual del partido no admite la transición pedida.
                      requestId: 8f0c2a1e-6b3d-4f7a-9d55-2a1b7c9e4d10
                      detalles:
                      - campo: nuevoEstado
                        problema: no se permite FINALIZADO -> EN_JUEGO; estado actual FINALIZADO
              schema:
                $ref: '#/components/schemas/RespuestaError'
        '500':
          description: ERROR_INTERNO. Error inesperado o de configuración; el detalle queda solo en logs.
          content:
            application/json:
              examples:
                ERROR_INTERNO:
                  summary: ERROR_INTERNO
                  value:
                    error:
                      codigo: ERROR_INTERNO
                      mensaje: Ocurrió un error inesperado.
                      requestId: 8f0c2a1e-6b3d-4f7a-9d55-2a1b7c9e4d10
                      detalles: []
              schema:
                $ref: '#/components/schemas/RespuestaError'
        '503':
          description: DEPENDENCIA_NO_DISPONIBLE. Una fuente de datos necesaria no está disponible.
          content:
            application/json:
              examples:
                DEPENDENCIA_NO_DISPONIBLE:
                  summary: DEPENDENCIA_NO_DISPONIBLE
                  value:
                    error:
                      codigo: DEPENDENCIA_NO_DISPONIBLE
                      mensaje: Una fuente de datos necesaria no está disponible.
                      requestId: 8f0c2a1e-6b3d-4f7a-9d55-2a1b7c9e4d10
                      detalles: []
              schema:
                $ref: '#/components/schemas/RespuestaError'
        '504':
          description: DEPENDENCIA_TIMEOUT. Una fuente de datos no respondió a tiempo; en escrituras,
            el resultado es incierto.
          content:
            application/json:
              examples:
                DEPENDENCIA_TIMEOUT:
                  summary: DEPENDENCIA_TIMEOUT
                  value:
                    error:
                      codigo: DEPENDENCIA_TIMEOUT
                      mensaje: Una fuente de datos no respondió a tiempo.
                      requestId: 8f0c2a1e-6b3d-4f7a-9d55-2a1b7c9e4d10
                      detalles: []
              schema:
                $ref: '#/components/schemas/RespuestaError'
