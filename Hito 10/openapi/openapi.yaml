tags:
- name: Salud
  description: Conectividad de las fuentes.
- name: Equipos · MongoDB
  description: Hito 4. Documentos de equipos y jugadores; ficha cacheada en Redis
    (Hito 7).
- name: Partidos · Neo4j
  description: Hito 5. Recorridos parametrizados del grafo.
- name: Comentarios · Cassandra
  description: Hito 6. Lectura por partición (partido, minuto, segmento).
- name: Estadísticas · InfluxDB
  description: Hito 8. Ventanas temporales agregadas.
- name: Sesiones · Redis
  description: Hito 7. Sesiones con TTL e invalidación.
- name: Actas · IRIS
  description: Hito 9. Objetos persistentes y transición de estado validada.
