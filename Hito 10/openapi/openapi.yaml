        '504':
          description: La dependencia excedió el tiempo de espera identificado por
            el driver.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '400':
          description: Validación fallida. No se consulta ninguna fuente.
          content: *id001
        '500':
          description: Error interno seguro; detalle solo en logs.
          content: *id001
  /api/v1/partidos/{partidoId}/comentarios:
    get:
      tags:
      - Comentarios · Cassandra
      summary: Comentarios de una ventana de hasta 5 minutos, con cursor
      operationId: comentarios_api_v1_partidos__partidoId__comentarios_get
      parameters:
      - name: partidoId
        in: path
        required: true
        schema:
          type: string
          pattern: ^PAR-\d{3}$
          examples:
          - PAR-001
          title: Partidoid
      - name: desde
        in: query
        required: true
        schema:
          type: string
          format: date-time
          examples:
          - '2030-06-10T18:00:00Z'
          title: Desde
      - name: hasta
        in: query
        required: true
        schema:
          type: string
          format: date-time
          examples:
          - '2030-06-10T18:03:00Z'
          title: Hasta
      - name: limite
        in: query
        required: false
        schema:
          type: integer
          maximum: 50
          minimum: 1
          default: 20
          title: Limite
      - name: cursor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            pattern: ^\d{13}_[A-Za-z0-9-]{1,64}$
          - type: 'null'
          title: Cursor
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Respuesta_VentanaComentarios_'
        '503':
          description: Dependencia no disponible o acceso rechazado. No equivale a
            un resultado vacío.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '504':
          description: La dependencia excedió el tiempo de espera identificado por
            el driver.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '400':
          description: Validación fallida. No se consulta ninguna fuente.
          content: *id001
        '500':
          description: Error interno seguro; detalle solo en logs.
          content: *id001
    post:
      tags:
      - Comentarios · Cassandra
      summary: Publicar un comentario (requiere Idempotency-Key)
      operationId: crear_comentario_api_v1_partidos__partidoId__comentarios_post
      parameters:
      - name: partidoId
        in: path
        required: true
        schema:
          type: string
          pattern: ^PAR-\d{3}$
          examples:
          - PAR-001
          title: Partidoid
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9-]{8,64}$
          title: Idempotency-Key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ComentarioNuevo'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Respuesta_ComentarioCreado_'
        '200':
          description: 'Repetición con la misma Idempotency-Key: devuelve el comentario
            original sin crear otra fila (Idempotent-Replayed: true).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Respuesta_ComentarioCreado_'
        '404':
          description: Recurso inexistente (o sesión no vigente).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '409':
          description: Conflicto con el estado actual del recurso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '503':
          description: Dependencia no disponible o acceso rechazado. No equivale a
            un resultado vacío.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '504':
          description: La dependencia excedió el tiempo de espera identificado por
            el driver.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '400':
          description: Validación fallida. No se consulta ninguna fuente.
          content: *id001
        '500':
          description: Error interno seguro; detalle solo en logs.
          content: *id001
  /api/v1/partidos/{partidoId}/estadisticas:
    get:
      tags:
      - Estadísticas · InfluxDB
      summary: Resumen temporal por intervalo (ventana acotada)
      description: Sin `desde`/`hasta` devuelve los últimos 10 minutos con datos del
        partido. Máximo 720 intervalos por equipo.
      operationId: estadisticas_api_v1_partidos__partidoId__estadisticas_get
      parameters:
      - name: partidoId
        in: path
        required: true
        schema:
          type: string
          pattern: ^PAR-\d{3}$
          examples:
          - PAR-001
          title: Partidoid
      - name: equipoId
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            pattern: ^EQ-\d{3}$
          - type: 'null'
          title: Equipoid
      - name: desde
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Desde
      - name: hasta
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Hasta
      - name: intervalo
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/Intervalo'
          default: 1m
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Respuesta_Estadisticas_'
        '503':
          description: Dependencia no disponible o acceso rechazado. No equivale a
            un resultado vacío.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '504':
          description: La dependencia excedió el tiempo de espera identificado por
            el driver.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '400':
          description: Validación fallida. No se consulta ninguna fuente.
          content: *id001
        '500':
          description: Error interno seguro; detalle solo en logs.
          content: *id001
  /api/v1/sesiones:
    post:
      tags:
      - Sesiones · Redis
      summary: Abrir una sesión con TTL
      operationId: crear_sesion_api_v1_sesiones_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SesionNueva'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Respuesta_Sesion_'
        '503':
          description: Dependencia no disponible o acceso rechazado. No equivale a
            un resultado vacío.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '504':
          description: La dependencia excedió el tiempo de espera identificado por
            el driver.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '400':
          description: Validación fallida. No se consulta ninguna fuente.
          content: *id001
        '500':
          description: Error interno seguro; detalle solo en logs.
          content: *id001
  /api/v1/sesiones/{sesionId}:
    get:
      tags:
      - Sesiones · Redis
      summary: Consultar una sesión vigente
      operationId: obtener_sesion_api_v1_sesiones__sesionId__get
      parameters:
      - name: sesionId
        in: path
        required: true
        schema:
          type: string
          pattern: ^SES-[0-9a-f]{24}$
          title: Sesionid
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Respuesta_Sesion_'
        '404':
          description: Recurso inexistente (o sesión no vigente).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '503':
          description: Dependencia no disponible o acceso rechazado. No equivale a
            un resultado vacío.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '504':
          description: La dependencia excedió el tiempo de espera identificado por
            el driver.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '400':
          description: Validación fallida. No se consulta ninguna fuente.
          content: *id001
        '500':
          description: Error interno seguro; detalle solo en logs.
          content: *id001
    delete:
      tags:
      - Sesiones · Redis
      summary: Cerrar (invalidar) una sesión; idempotente
      operationId: cerrar_sesion_api_v1_sesiones__sesionId__delete
      parameters:
      - name: sesionId
        in: path
        required: true
        schema:
          type: string
          pattern: ^SES-[0-9a-f]{24}$
          title: Sesionid
      responses:
        '204':
          description: Successful Response
        '503':
          description: Dependencia no disponible o acceso rechazado. No equivale a
            un resultado vacío.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '504':
          description: La dependencia excedió el tiempo de espera identificado por
            el driver.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '400':
          description: Validación fallida. No se consulta ninguna fuente.
          content: *id001
        '500':
          description: Error interno seguro; detalle solo en logs.
          content: *id001
  /api/v1/actas/{codigo}:
    get:
      tags:
      - Actas · IRIS
      summary: 'Acta del partido: árbitro, estado y eventos'
      operationId: acta_api_v1_actas__codigo__get
      parameters:
      - name: codigo
        in: path
        required: true
        schema:
          type: string
          pattern: ^[A-Z0-9][A-Z0-9-]{2,23}$
          examples:
          - PAR-001
          title: Codigo
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Respuesta_Acta_'
        '404':
          description: Recurso inexistente (o sesión no vigente).
          content:
            application/json:
