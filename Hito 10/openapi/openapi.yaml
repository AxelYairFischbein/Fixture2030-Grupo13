          content: *id001
        '500':
          description: Error interno seguro; detalle solo en logs.
          content: *id001
  /api/v1/actas/{codigo}/estado:
    put:
      tags:
      - Actas · IRIS
      summary: Transición de estado validada por el dominio
      description: 'PENDIENTE -> EN_JUEGO -> FINALIZADO. Pedir el estado actual responde
        `cambio: false`.'
      operationId: cambiar_estado_api_v1_actas__codigo__estado_put
      parameters:
      - name: codigo
        in: path
        required: true
        schema:
          type: string
          pattern: ^[A-Z0-9][A-Z0-9-]{2,23}$
          examples:
          - PAR-001
          title: Codigo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CambioEstado'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Respuesta_ActaCambio_'
        '404':
          description: Recurso inexistente (o sesión no vigente).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '409':
          description: Conflicto con el estado actual del recurso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '503':
          description: Dependencia no disponible o acceso rechazado. No equivale a
            un resultado vacío.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '504':
          description: La dependencia excedió el tiempo de espera identificado por
            el driver.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorRespuesta'
        '400':
          description: Validación fallida. No se consulta ninguna fuente.
          content: *id001
        '500':
          description: Error interno seguro; detalle solo en logs.
          content: *id001
components:
  schemas:
    Acta:
      properties:
        id:
          type: string
          title: Id
        codigo:
          type: string
          title: Codigo
        estadioCodigo:
          type: string
          title: Estadiocodigo
        estado:
          $ref: '#/components/schemas/EstadoPartido'
        arbitro:
          $ref: '#/components/schemas/Arbitro'
        eventos:
          items:
            $ref: '#/components/schemas/EventoActa'
          type: array
          title: Eventos
      type: object
      required:
      - id
      - codigo
      - estadioCodigo
      - estado
      - arbitro
      - eventos
      title: Acta
    ActaCambio:
      properties:
        cambio:
          type: boolean
          title: Cambio
          description: false si el partido ya estaba en el estado pedido (PUT idempotente).
        acta:
          $ref: '#/components/schemas/Acta'
      type: object
      required:
      - cambio
      - acta
