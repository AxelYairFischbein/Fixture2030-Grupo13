openapi: 3.1.0
info:
  title: Fixture 2030 · API integrada
  description: 'API REST del Hito 10 (Grupo 13) sobre MongoDB, Neo4j, Cassandra, Redis, InfluxDB e InterSystems
    IRIS. Datos sintéticos.


    Toda respuesta lleva el encabezado `X-Request-Id` (se acepta el del cliente si es un UUID). Todo error
    usa el formato único `{"error": {codigo, mensaje, requestId, detalles}}` (casos_de_uso.md §6.1). Además
    de los errores declarados en cada operación, cualquier ruta inexistente responde `404 RUTA_NO_ENCONTRADA`
    y un método no admitido `405 METODO_NO_PERMITIDO` con el encabezado `Allow`. Las operaciones protegidas
    reciben la sesión en `X-Session-Id`, nunca en la ruta ni en la query.'
  version: 0.8.0
paths:
  /api/v1/salud:
    get:
      tags:
      - salud
      summary: Estado de las dependencias
      description: Informa por dependencia "disponible", "no_disponible" o "no_configurada", y el estado
        del catálogo de partidos en memoria (cargado, cantidad de partidos y hora de la última carga,
        casos_de_uso.md §3.2).
      operationId: consultar_salud_api_v1_salud_get
      responses:
        '200':
          description: Respuesta exitosa.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaSalud'
        '500':
          description: ERROR_INTERNO. Error inesperado o de configuración; el detalle queda solo en logs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaError'
              examples:
                ERROR_INTERNO:
                  summary: ERROR_INTERNO
                  value:
                    error:
                      codigo: ERROR_INTERNO
                      mensaje: Ocurrió un error inesperado.
                      requestId: 8f0c2a1e-6b3d-4f7a-9d55-2a1b7c9e4d10
                      detalles: []
  /api/v1/equipos:
    get:
      tags:
      - equipos
      summary: CU-02 · Listar equipos de una confederación
      description: Orden rankingReferencia ASC, equipoId ASC. Sin coincidencias → items vacío.
      operationId: listar_equipos_api_v1_equipos_get
      parameters:
      - name: confederacion
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/Confederacion'
      - name: rankingMax
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            maximum: 250
            minimum: 1
          - type: 'null'
          title: Rankingmax
      - name: limite
        in: query
        required: false
        schema:
          type: integer
          maximum: 50
          minimum: 1
          default: 20
          title: Limite
      - name: pagina
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          description: Número de página, desde 1.
          default: 1
          title: Pagina
        description: Número de página, desde 1.
      responses:
        '200':
          description: Respuesta exitosa.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaEquipos'
        '400':
          description: VALIDACION. Parámetro ausente, con formato inválido o fuera de rango; intervalo
            invertido o excedido; body con campos extra. Se responde antes de consultar.
          content:
            application/json:
              examples:
                VALIDACION:
                  summary: VALIDACION
                  value:
                    error:
                      codigo: VALIDACION
                      mensaje: La solicitud tiene datos inválidos.
                      requestId: 8f0c2a1e-6b3d-4f7a-9d55-2a1b7c9e4d10
                      detalles:
                      - campo: partidoId
                        problema: no cumple el formato ^PAR-\d{3}$
              schema:
                $ref: '#/components/schemas/RespuestaError'
        '500':
          description: ERROR_INTERNO. Error inesperado o de configuración; el detalle queda solo en logs.
          content:
            application/json:
              examples:
                ERROR_INTERNO:
                  summary: ERROR_INTERNO
                  value:
                    error:
                      codigo: ERROR_INTERNO
                      mensaje: Ocurrió un error inesperado.
                      requestId: 8f0c2a1e-6b3d-4f7a-9d55-2a1b7c9e4d10
                      detalles: []
              schema:
                $ref: '#/components/schemas/RespuestaError'
        '503':
          description: DEPENDENCIA_NO_DISPONIBLE. Una fuente de datos necesaria no está disponible.
          content:
            application/json:
              examples:
                DEPENDENCIA_NO_DISPONIBLE:
                  summary: DEPENDENCIA_NO_DISPONIBLE
                  value:
                    error:
                      codigo: DEPENDENCIA_NO_DISPONIBLE
                      mensaje: Una fuente de datos necesaria no está disponible.
                      requestId: 8f0c2a1e-6b3d-4f7a-9d55-2a1b7c9e4d10
                      detalles: []
              schema:
                $ref: '#/components/schemas/RespuestaError'
        '504':
          description: DEPENDENCIA_TIMEOUT. Una fuente de datos no respondió a tiempo; en escrituras,
            el resultado es incierto.
          content:
            application/json:
              examples:
                DEPENDENCIA_TIMEOUT:
                  summary: DEPENDENCIA_TIMEOUT
                  value:
                    error:
                      codigo: DEPENDENCIA_TIMEOUT
                      mensaje: Una fuente de datos no respondió a tiempo.
                      requestId: 8f0c2a1e-6b3d-4f7a-9d55-2a1b7c9e4d10
                      detalles: []
              schema:
                $ref: '#/components/schemas/RespuestaError'
  /api/v1/equipos/{equipoId}:
    get:
      tags:
      - equipos
      summary: CU-01 · Ver ficha de un equipo
      description: 'Cache-aside: Redis (copia por 300 s) delante de MongoDB. Con Redis caído responde
        igual desde MongoDB con X-Cache: BYPASS.'
      operationId: ver_equipo_api_v1_equipos__equipoId__get
      parameters:
      - name: equipoId
        in: path
        required: true
        schema:
          type: string
          pattern: ^EQ-\d{3}$
          examples:
          - EQ-001
          title: Equipoid
      responses:
        '200':
          description: Respuesta exitosa.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FichaEquipo'
          headers:
            X-Cache:
              description: 'HIT: copia de Redis. MISS: leída de MongoDB y guardada por 300 s. BYPASS:
                Redis no disponible, leída de MongoDB sin caché.'
              schema:
                type: string
                enum:
                - HIT
                - MISS
                - BYPASS
        '400':
          description: VALIDACION. Parámetro ausente, con formato inválido o fuera de rango; intervalo
            invertido o excedido; body con campos extra. Se responde antes de consultar.
          content:
            application/json:
              examples:
                VALIDACION:
                  summary: VALIDACION
                  value:
                    error:
                      codigo: VALIDACION
                      mensaje: La solicitud tiene datos inválidos.
                      requestId: 8f0c2a1e-6b3d-4f7a-9d55-2a1b7c9e4d10
                      detalles:
                      - campo: partidoId
                        problema: no cumple el formato ^PAR-\d{3}$
              schema:
                $ref: '#/components/schemas/RespuestaError'
        '404':
          description: EQUIPO_NO_ENCONTRADO. El recurso principal de la ruta no existe.
          content:
            application/json:
              examples:
                EQUIPO_NO_ENCONTRADO:
                  summary: EQUIPO_NO_ENCONTRADO
                  value:
                    error:
                      codigo: EQUIPO_NO_ENCONTRADO
                      mensaje: No existe un equipo con el identificador indicado.
                      requestId: 8f0c2a1e-6b3d-4f7a-9d55-2a1b7c9e4d10
