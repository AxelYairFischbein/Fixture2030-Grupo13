global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

rule_files:
  - /etc/prometheus/reglas.yml

scrape_configs:
  - job_name: fixture-api
    static_configs:
      - targets: [host.docker.internal:8000]
        labels:
          component: api
  - job_name: mongodb
    static_configs:
      - targets: [mongodb-exporter:9216]
        labels:
          component: mongodb
  - job_name: redis
    static_configs:
      - targets: [redis-exporter:9121]
        labels:
          component: redis
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
        labels:
          component: prometheus
