name: grupo13-hito13

services:
  prometheus:
    image: prom/prometheus:v3.5.0
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./reglas.yml:/etc/prometheus/reglas.yml:ro
      - ${USERPROFILE:?Definir USERPROFILE}/docker/data/fixture2030-h13/prometheus:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.1
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Completar .env local}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ${USERPROFILE:?Definir USERPROFILE}/docker/data/fixture2030-h13/grafana:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    restart: unless-stopped

  mongodb-exporter:
    image: percona/mongodb_exporter:0.47.1
    environment:
      MONGODB_URI: mongodb://host.docker.internal:27017/admin?authSource=admin
      MONGODB_USER: ${MONGODB_USER:?Completar .env local}
      MONGODB_PASSWORD: ${MONGODB_PASSWORD:?Completar .env local}
    command:
      - --collector.diagnosticdata
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  redis-exporter:
    image: oliver006/redis_exporter:v1.76.0
    environment:
      REDIS_ADDR: redis://host.docker.internal:16379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
