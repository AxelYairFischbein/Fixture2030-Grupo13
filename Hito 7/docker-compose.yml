name: grupo13-hito7

services:
  redis:
    image: redis:latest
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --save
      - ""
      - --maxmemory
      - 64mb
      - --maxmemory-policy
      - noeviction
    ports:
      - "127.0.0.1:16379:6379"
    volumes:
      - redis_data:/data
      - ./scripts:/scripts:ro
    mem_limit: 256m
    cpus: 1.0
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  redis_data:
    name: grupo13_hito7_redis_data
